substitutions:
  # PROJECT_ID is automatically populated by Cloud Build
  # Service account registered as the PyPI trusted publisher for this project.
  # Cloud Build's metadata proxy has no "default" identity alias, so `id`
  # must be told explicitly which service account to mint an OIDC token for.
  # The build's own runtime service account needs roles/iam.serviceAccountTokenCreator
  # on this account to impersonate it.
  _PYPI_SA_EMAIL: agent-bus-build-ci-runner@agent-bus-build.iam.gserviceaccount.com

# Build steps.
steps:
  # The Firestore emulator, for the cloud store tests.
  #
  # Started detached on the shared `cloudbuild` network so the step exits
  # immediately and the container keeps running -- Cloud Build has no notion of
  # a service container, and a step that blocked would hang the build. The next
  # step reaches it by container name.
  #
  # ci-build.sh waits for it and FAILS if it never answers. A missing emulator
  # must not degrade to eight silent skips: that is #81 again, smaller.
  - id: firestore-emulator
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - -d
      - --name=firestore
      - --network=cloudbuild
      - gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
      - gcloud
      - emulators
      - firestore
      - start
      - --host-port=0.0.0.0:8085

  # 1. Ensure hatch-vcs sees the tag.
  - id: show-version
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        # 1. Specifically fetch the tag that triggered the build from the remote
        git fetch --depth=1 origin +refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}
        
        # 2. Force the checkout to that tag
        git checkout -f ${TAG_NAME}
        
        echo "TAG_NAME=${TAG_NAME}"
        echo "Current commit: $(git rev-parse HEAD)"
        echo "git describe: $(git describe --tags --always)"



  # 2. Gate the release on the tests. A tag that fails here never reaches PyPI,
  #     which until now it would have: this pipeline published without running a
  #     single test.
  #
  #     Scope is deliberately lint + the tests that cost nothing. The `spendy`
  #     ones drive real coding agents
  #     making real model calls, so they need five binaries and five credentials
  #     and cost money and minutes per run -- a blocking gate you would learn to
  #     ignore. Those run in the `agents` container instead (see docker-compose).
  #     Those are credential-free: CLI only, no model, no network.
  - id: lint-and-test
    name: ghcr.io/astral-sh/uv:python3.11-bookworm
    entrypoint: bash
    env:
      # The container from the emulator step, by name on the shared network.
      # Setting this makes the emulator REQUIRED -- see ci-build.sh. The
      # release gate runs the same tests as the pull-request gate or it is not
      # the same gate.
      - FIRESTORE_EMULATOR_HOST=firestore:8085
    args: ["ci-build.sh"]

  # 3. Build sdist + wheel into dist/ using uv.
  - id: build
    name: ghcr.io/astral-sh/uv:python3.11-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        uv build
        ls -la dist/


  # 4. Publish to PyPi
  - id: publish-to-pypi
    name: ghcr.io/astral-sh/uv:python3.11-bookworm
    entrypoint: bash
    env:
      # Cloud Build's metadata server has no "default" service-account alias
      # (unlike a plain GCE VM), so `id` must be told which identity to
      # request an OIDC token for. See _PYPI_SA_EMAIL above.
      - GOOGLE_SERVICE_ACCOUNT_NAME=${_PYPI_SA_EMAIL}
    args:
      - -c
      - |
        set -e
        uv pip install --system -U id twine
        oidc_token=$(python -m id pypi)
        resp=$(curl -s -X POST https://pypi.org/_/oidc/mint-token -d "{\"token\": \"${oidc_token}\"}")
        api_token=$(python -c "import sys, json; data = json.load(sys.stdin); sys.exit('PyPI OIDC token mint failed: ' + json.dumps(data)) if 'token' not in data else print(data['token'])" <<< "$resp")
        TWINE_USERNAME=__token__ TWINE_PASSWORD="$api_token" twine upload dist/*

options:
  logging: CLOUD_LOGGING_ONLY
  # requestedVerifyOption: VERIFIED was here, commented "required to allow twine
  # to use the service account credentials". It is not, and it was making every
  # build report Failed:
  #
  #   Failed to verify build. Please confirm the Container Analysis API is
  #   enabled, and that the Cloud Build Service Agent has the
  #   serviceusage.services.use permission.
  #
  # VERIFIED asks Cloud Build to generate build provenance, which needs the
  # Container Analysis API. Nothing to do with twine: the OIDC token is minted
  # from the metadata server via GOOGLE_SERVICE_ACCOUNT_NAME, and that worked
  # regardless -- which is why packages published while the build showed red.
  #
  # Not re-enabled by turning the API on, because the provenance would go
  # unused. GCB attestations are for container images gated by Binary
  # Authorization; this pipeline ships a wheel to PyPI, where the supply-chain
  # claim comes from PyPI's own trusted publishing. A red build that published
  # fine is worse than no attestation: it trains you to ignore the signal.
