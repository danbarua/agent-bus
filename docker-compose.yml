# Run agent-bus's own tests without disturbing the agent-bus you are running.
#
#   docker compose run --rm test      unit suite, no credentials needed
#   docker compose run --rm ci-build  exactly what CI runs, in CI's image
#   docker compose run --rm e2e       full integration suite, needs API keys
#
# The container has its own HOME, its own ~/.agent-bus, its own /tmp/cc-socks and
# its own PID namespace, so nothing it does is visible to the live bus on the
# host. That isolation is the entire point: the tests that message a real Claude
# session deliberately switch OFF
# the AGENT_BUS_*_DIR overrides because they must discover a real Claude peer, so
# they cannot be isolated by environment variable -- only by kernel.

services:
  # Everyday loop: run the unit suite against your working tree.
  test:
    build:
      context: .
      target: ci
    init: true
    volumes:
      # Live edits. UV_PROJECT_ENVIRONMENT puts the venv at /opt/venv, outside
      # this mount, so bind-mounting the source does not shadow it -- and the
      # host's macOS .venv is ignored rather than half-used.
      - .:/workspace/agent-bus
    command: uv run python -m pytest tests/ -q

  # Exactly what CI runs, in the image CI runs it in.
  #
  # Not the `test` service above: that builds our Dockerfile's ci target, which
  # is close to the build but not the same thing. This runs the bare uv image
  # and the same ci-build.sh the two cloudbuild configs call, so what passes
  # here is what passes there.
  ci-build:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm
    init: true
    working_dir: /workspace/agent-bus
    depends_on:
      - firestore
    volumes:
      - .:/workspace/agent-bus
    environment:
      # The same variable the build sets, pointing at the service below. It
      # makes the emulator REQUIRED -- ci-build.sh fails rather than letting
      # the store tests skip. Running `test` instead of `ci-build` gets the
      # skips back, which is the right default for a quick loop.
      FIRESTORE_EMULATOR_HOST: firestore:8085
      # hatch-vcs derives the version from git tags; a checkout without them
      # cannot resolve one, and uv sync dies on something unrelated to the code.
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0+ci"
      # The venv MUST live outside the bind mount. Without this, `uv sync` in
      # the container writes a Linux venv into your checkout at ./.venv and
      # replaces the one your editor and `uv run` use on the host. The Dockerfile
      # sets the same variable for the same reason; a bare image does not.
      UV_PROJECT_ENVIRONMENT: /opt/venv
    command: bash ci-build.sh

  # The Firestore emulator the cloud store tests need. Same image the build
  # uses, so what passes on a laptop is what passes in CI -- which is the whole
  # argument for the ci-build service existing at all.
  #
  # 1.4GB, pulled once. `docker compose run --rm ci-build` starts it
  # automatically; nothing else needs it.
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    init: true
    command: gcloud emulators firestore start --host-port=0.0.0.0:8085

  # Full e2e: five real coding agents making real model calls.
  e2e:
    secrets: [anthropic_api_key, openai_api_key, xai_api_key]
    build:
      context: .
      target: agents
    init: true
    volumes:
      - .:/workspace/agent-bus
    environment:
      # Without this every opt-in test skips itself, and the run
      # passes having tested nothing.
      AGENT_BUS_RUN_SPENDY_E2E_TESTS: "1"

      # The API keys are NOT here. They arrive as secrets (bottom of this
      # file) and docker-entrypoint.sh exports them. See the note there for
      # why: `environment:` puts a key in the container config, so both
      # `docker compose config` and `docker inspect` print it in full.

      # Which model each harness runs is pinned in tests/support/models.py, so
      # there is nothing to declare here. Override one for a single run with
      # `docker compose run -e AGENT_BUS_PI_MODEL=<provider/id> --rm e2e`.

      # Records every verb call. The default is WARNING, which is right for an
      # agent in someone's terminal and useless for a run you are reviewing.
      AGENT_BUS_LOG_LEVEL: ${AGENT_BUS_LOG_LEVEL:-INFO}

    # Everything, in two passes, because only one of them has artefacts worth
    # keeping. `--rm` throws the container away, so this is the run you get.
    #
    # `--basetemp` is per-run, not per-test, so pointing it at the bind mount
    # put every test's tmp_path there -- hundreds of directories of empty unit
    # scratch space around the handful with anything in them. Splitting the
    # invocation is what groups them: the cheap tests keep their temp files
    # inside the container where they belong, and `.e2e/` holds one directory
    # per spendy test.
    #
    # Nothing accumulates either way: pytest empties an explicit basetemp at
    # the start of every run, so `.e2e/` always holds exactly the last one.
    # Gitignored.
    #
    # Most of what basetemp creates per test is scaffolding nothing ever wrote
    # to -- a `project` or `bus` dir a passing test had no reason to touch. Left
    # in place, that scaffolding outnumbers the handful of directories with an
    # actual marker or log in them, which is what someone reviewing a failed
    # run is there for. Pruned after the run, not before: `-depth` deletes
    # children before the parent, so a directory empty only because its own
    # contents were just removed is caught in the same pass. `set -e` would
    # otherwise skip this on a spendy failure -- the one run most worth
    # pruning for -- so the spendy exit code is captured and restored after.
    command:
      - bash
      - -c
      - |
        set -e
        uv run python -m pytest tests -q -m "not spendy"
        spendy_rc=0
        uv run python -m pytest tests -q -s -m spendy \
          --basetemp=/workspace/agent-bus/.e2e || spendy_rc=$$?
        find /workspace/agent-bus/.e2e -mindepth 1 -depth -type d -empty -delete
        exit "$$spendy_rc"

  # Interactive poke-around in the full agent image.
  shell:
    secrets: [anthropic_api_key, openai_api_key, xai_api_key]
    build:
      context: .
      target: agents
    init: true
    volumes:
      - .:/workspace/agent-bus
    # API keys arrive as secrets -- see the bottom of this file.
    command: bash
    stdin_open: true
    tty: true

# Secrets, not environment variables, and the difference is what a debugger sees.
#
# `environment:` writes the value into the container's config, so
# `docker compose config` and `docker inspect` both print all three keys in
# full. That is fine on a laptop and not fine here: an agent debugging compose
# copies its output into a transcript, and a transcript cannot be un-written.
# Measured before changing this -- `docker compose config` showed six live
# keys; with this block it shows the variable NAMES and no values.
#
# `--no-interpolate` also hides them, and is a convention doing a control's
# job: it works until someone runs the command without it, which is exactly
# the shape this project keeps removing elsewhere.
#
# Sourced from the environment rather than from files, so `.env` stays one
# file and nothing new holds a key on disk. Compose reads the variable and
# mounts it at /run/secrets/<name>; docker-entrypoint.sh exports it from
# there, because the harnesses read their keys from the environment INSIDE
# the container, which is the one place they have to be.
secrets:
  anthropic_api_key:
    environment: ANTHROPIC_API_KEY
  openai_api_key:
    environment: OPENAI_API_KEY
  xai_api_key:
    environment: XAI_API_KEY
