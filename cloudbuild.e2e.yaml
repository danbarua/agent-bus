# The full integration suite, against five real coding agents. Manual trigger.
#
#   gcloud builds triggers run e2e-manual
#
# Not wired to push or pull_request on purpose. Every run makes real model calls
# through five agents and costs money and minutes. It earns its keep for
# confirming a regression against a pinned harness version, not as a gate.
#
# To test a suspect upstream release, override its version:
#   gcloud builds triggers run e2e-manual --substitutions=_GROK_VERSION=1.0.4

substitutions:
  # Defaults match the Dockerfile, which matches the maintainer's machine.
  # Overriding one is the whole reason this trigger exists.
  _CLAUDE_VERSION: "2.1.241"
  _CODEX_VERSION: "0.149.0"
  _PI_VERSION: "0.84.2"
  _OMP_VERSION: "18.0.3"
  _GROK_VERSION: "1.0.5"

  # pi's default provider is google; without a key-backed model it fails on an
  # unset Gemini key. Verified resolvable via `pi auth check`.
  _PI_MODEL: "anthropic/claude-sonnet-4-5"

  # A trigger checkout has the commit but not the tags, and hatch-vcs raises
  # rather than guessing. Nothing here publishes.
  _PRETEND_VERSION: "0.0.0+e2e"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/anthropic-api-key/versions/latest
      env: ANTHROPIC_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/openai-api-key/versions/latest
      env: OPENAI_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/xai-api-key/versions/latest
      env: XAI_API_KEY

steps:
  # 1. Build the agents image at the requested harness versions.
  #
  # Its build-time check runs every binary as the unprivileged user the tests
  # use, so a harness that failed to install fails here rather than showing up
  # later as a skip inside a green suite.
  - id: build-agents
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=agents
      - --build-arg=CLAUDE_VERSION=${_CLAUDE_VERSION}
      - --build-arg=CODEX_VERSION=${_CODEX_VERSION}
      - --build-arg=PI_VERSION=${_PI_VERSION}
      - --build-arg=OMP_VERSION=${_OMP_VERSION}
      - --build-arg=GROK_VERSION=${_GROK_VERSION}
      - --build-arg=SETUPTOOLS_SCM_PRETEND_VERSION=${_PRETEND_VERSION}
      - -t
      - agent-bus:agents
      - .

  # 2. Run every tier inside it.
  #
  # --init because agent-bus detaches a listener with start_new_session=True,
  # which becomes a zombie unless PID 1 reaps it.
  #
  # The keys are forwarded with bare `-e NAME`, taking the value from this
  # step's own environment rather than appearing in argv -- an argv entry is
  # visible to every other process via ps.
  #
  # -rs so a skip is reported with its reason. A skipped tier is a harness that
  # did not install, and 7-passed-1-skipped reads like success.
  - id: e2e
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - XAI_API_KEY
    args:
      - -c
      - |
        set -e
        # AGENT_BUS_INTEGRATION=1 is what makes tests/integration run at all:
        # every test in there skips itself without it, so leaving it out gives
        # a green build that tested nothing.
        docker run --rm --init \
          -e ANTHROPIC_API_KEY \
          -e OPENAI_API_KEY \
          -e XAI_API_KEY \
          -e AGENT_BUS_INTEGRATION=1 \
          -e AGENT_BUS_PI_MODEL=${_PI_MODEL} \
          agent-bus:agents \
          uv run python -m pytest tests/integration -q -rs

options:
  logging: CLOUD_LOGGING_ONLY

# Measured: agents image cold-builds in ~2 minutes, the suite runs in ~1m45.
# Model latency is the variable part, so this is generous on purpose -- a run
# killed at the deadline tells you nothing about the regression you came for.
timeout: 2400s
