[project]
name = "agent-bus"
version = "0.1.0"
description = "Inter-agent messaging bus for Claude Code, Grok, OMP, Codex and others"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "agent-bus"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
agent-bus = "agent_bus.cli:main"

[project.urls]
Homepage = "https://github.com/danbarua/agent-bus"
Repository = "https://github.com/danbarua/agent-bus"
Issues = "https://github.com/danbarua/agent-bus/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bus"]


[tool.hatch.build.targets.wheel.force-include]
"README.md" = "agent_bus/README.md"
"skills/SKILL.md" = "agent_bus/skills/SKILL.md"
"skills/references/UDS-protocol.md" = "agent_bus/skills/references/UDS-protocol.md"

[tool.uv]
package = true

[[tool.uv.index]]
url = "https://pypi.org/simple"

[dependency-groups] 
dev = ["pytest", "ruff"]
