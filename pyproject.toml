[project]
name = "agent-bus-team"
dynamic = ["version"]
description = "Inter-agent messaging bus for Claude Code, Grok, OMP, Codex and others"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Dan Barua"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
agent-bus = "agent_bus.cli:main"
# Its own entry point, not an `agent-bus` subcommand. agent_bridge depends on
# agent_bus and never the other way round; a subcommand would have inverted
# that. One distribution, because agent-bus-team is the two of them together.
agent-bridge = "agent_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/danbarua/agent-bus"
Repository = "https://github.com/danbarua/agent-bus"
Issues = "https://github.com/danbarua/agent-bus/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# The package's version comes from `v*` tags and no others.
#
# setuptools_scm's default tag regex allows a `<word>-` prefix and throws it
# away, so `cloud-v0.3.0` -- the server's tag namespace, deliberately separate
# from the package's -- parses as version 0.3.0. Measured: with a `cloud-v9.9.9`
# tag at HEAD, `uv build` produced `agent_bus_team-9.9.9.tar.gz`. The two
# namespaces are separate in the trigger and were not separate here.
#
# It has to be `--match` on describe rather than `tag_regex`. describe picks the
# nearest tag whatever the regex says, and setuptools_scm then refuses to parse
# it -- which turns a wrong version into a failed build.
raw-options = { git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"] }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bus", "src/agent_bridge"]

# An INCLUDE list, not an exclude one, and that is the whole point: hatchling's
# default is everything git tracks, which put `cloud/` and `infra/` -- two
# separate deployables with their own dependencies and their own lifecycle --
# inside the bus's own sdist. `cloud/pyproject.toml` calls itself "not part of
# the published wheel", which was true of the wheel and not of this.
#
# Listing what goes in means the next deployable is out by default. An exclude
# list would need editing every time one is added, and would be edited late.
#
# `tests/` stays: a downstream packager building from source should be able to
# run the suite, and that is what an sdist is for.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/",
    "tests/",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]


# Docs are repo-only: the wheel carries the README, and its doc links point at
# GitHub rather than shipping copies that go stale in site-packages.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "agent_bus/README.md"

[tool.uv]
package = true

[[tool.uv.index]]
url = "https://pypi.org/simple"

[dependency-groups]
# ruff is pinned EXACTLY, not floated. Its default rule set is broad -- 413
# rules at 0.16.4 -- and patch releases add and retune rules, so an unpinned
# lint gate starts failing on code nobody touched. Bump it deliberately, in a
# commit that also fixes whatever the new rules find.
dev = ["pytest", "ruff==0.16.4"]


[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
# Selected explicitly. Leaving this unset inherits whatever the installed ruff
# calls "default", which is how this project ended up with 413 rules enabled
# and none of them chosen.
select = [
    "E4", "E7", "E9",  # pycodestyle: real errors, not whitespace preference
    "E501",            # line length, at 100 -- see [tool.ruff] above
    "F",               # pyflakes: unused imports and names
    "I",               # import sorting
    "UP",              # pyupgrade: we are >=3.11, so use it
    "B",               # bugbear
    "SIM",             # simplify
    "RET",             # return statements
    "PIE",
    "ISC",             # implicit string concatenation
    "PL",              # pylint
    "RUF",
    "BLE",             # blind except -- deliberately ON; see per-file-ignores
    "S",               # bandit
]

ignore = [
    # Lazy imports are a design decision here, not an oversight: they keep CLI
    # startup cheap and one of them breaks a genuine import cycle
    # (adapters -> transport -> filebus -> store). They are already checked --
    # tests/test_conventions.py resolves every function-scoped relative import,
    # which is the failure this rule is a proxy for.
    "PLC0415",

    # /tmp is not a choice. /tmp/cc-socks is where Claude Code puts its peer
    # sockets, and tests need short /tmp paths because AF_UNIX caps a path near
    # 104 bytes -- pytest's tmp_path overruns it.
    "S108",

    # Complexity metrics. Subjective, and wrong about this codebase: the frame
    # handler and the CLI parser are long because the protocol and the command
    # surface are, and splitting them to satisfy a counter would scatter one
    # readable thing across five.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",

    # Running `ps` and spawning our own CLI is what this project does. The
    # "untrusted input" is a pid we generated, and a full path to ps is not
    # portable -- /bin/ps on macOS, /usr/bin/ps on much of Linux. Pinning one
    # would break the other, and the check would still not be verifying
    # anything an attacker could reach.
    "S603", "S607",

    # Magic-value comparison. Fires on `len(parts) == 2` in an address parser
    # and `>= 2` in a pid check, where the literal IS the meaning and naming it
    # (TWO_PART_ADDRESS = 2) would obscure rather than explain.
    "PLR2004",
]


[tool.ruff.lint.per-file-ignores]
# The wire. uds.py parses frames written by another process, and a frame that
# is malformed, truncated or from a version we have never seen must not take
# the listener down -- degrading to "ignore this frame" is the module's job
# rather than a lapse. 29 of the project's 61 swallow sites are here.
"src/agent_bus/uds.py" = ["BLE001", "S110", "S112"]

# Every function here is a command handler whose job is to turn any failure
# into an exit code and one line on stderr. A CLI that lets a traceback reach
# the user has failed at being a CLI, so catching broadly is the contract
# rather than a lapse.
"src/agent_bus/cli.py" = ["BLE001"]

# Tests get three rules that are simply wrong here:
#   PLW1510 subprocess.run without check= -- returncode is asserted explicitly,
#           which is more informative than a CalledProcessError traceback.
#   SIM115  open() without a context manager -- log files are handed to Popen
#           and must outlive the block; closing them is the bug.
#   S603/S607 subprocess with a partial path -- running the CLI under test.
# Cleanup paths may also swallow: a failure while tearing down a fixture must
# not mask the assertion that got us there.
# A parametrize table of real session ids. Every row is one address and its
# expected parse; wrapping each tuple across four lines would turn a table you
# can scan into a wall you cannot.
"tests/agent_bus/test_address.py" = ["E501"]

"tests/**" = [
    "S101",     # assert IS the test. 585 of them, and every one is correct.
    "PLW1510", "SIM115", "S603", "S607",
    "BLE001", "S110", "S112",
    "PLR2004",  # magic values in assertions are the point
]

# The one bus test that authenticates. A test key and a test passphrase are
# not credentials; S105/S106 cannot tell the difference, and the file has to
# have something to present at the door.
"tests/agent_bridge/test_cloud_client.py" = ["S105", "S106"]

# The cloud server's tests. Same reasoning as above, plus one of its own:
# S310 flags urllib.urlopen on a non-literal URL, and driving the server over a
# real socket is the entire point of those tests -- the predecessor's bugs all
# lived between "the function returns the right dict" and "a connector could
# read it".
"cloud/tests/**" = [
    "S101", "PLR2004", "S310",
    # A fake bearer, a test passphrase and the literal string "Bearer" are not
    # credentials. S105/S106 cannot tell, and a test that authenticates has to
    # have something to authenticate with.
    "S105", "S106",
]


[tool.pytest.ini_options]
# The bus's own tests, and only those. `cloud/` is a separate deployable with
# its own pyproject and its own dependencies -- collecting it here would fail on
# an import the bus deliberately does not have.
testpaths = ["tests"]
markers = [
    # Spawns a real coding agent or a live Claude session: costs money and
    # minutes. `./spendy_tests.sh` runs them; an ordinary sweep skips them.
    "spendy: needs a real agent or a Claude session",
]
