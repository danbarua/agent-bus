# Run agent-bus's own tests without disturbing the agent-bus you are running.
#
#   docker compose run --rm test      unit suite, no credentials needed
#   docker compose run --rm ci-build  exactly what CI runs, in CI's image
#   docker compose run --rm e2e       full integration suite, needs API keys
#
# The container has its own HOME, its own ~/.agent-bus, its own /tmp/cc-socks and
# its own PID namespace, so nothing it does is visible to the live bus on the
# host. That isolation is the entire point: the tests that message a real Claude
# session deliberately switch OFF
# the AGENT_BUS_*_DIR overrides because they must discover a real Claude peer, so
# they cannot be isolated by environment variable -- only by kernel.

services:
  # Everyday loop: run the unit suite against your working tree.
  test:
    build:
      context: .
      target: ci
    init: true
    volumes:
      # Live edits. UV_PROJECT_ENVIRONMENT puts the venv at /opt/venv, outside
      # this mount, so bind-mounting the source does not shadow it -- and the
      # host's macOS .venv is ignored rather than half-used.
      - .:/workspace/agent-bus
    command: uv run python -m pytest tests/ -q

  # Exactly what CI runs, in the image CI runs it in.
  #
  # Not the `test` service above: that builds our Dockerfile's ci target, which
  # is close to the build but not the same thing. This runs the bare uv image
  # and the same ci-build.sh the two cloudbuild configs call, so what passes
  # here is what passes there.
  ci-build:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm
    init: true
    working_dir: /workspace/agent-bus
    volumes:
      - .:/workspace/agent-bus
    environment:
      # hatch-vcs derives the version from git tags; a checkout without them
      # cannot resolve one, and uv sync dies on something unrelated to the code.
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0+ci"
      # The venv MUST live outside the bind mount. Without this, `uv sync` in
      # the container writes a Linux venv into your checkout at ./.venv and
      # replaces the one your editor and `uv run` use on the host. The Dockerfile
      # sets the same variable for the same reason; a bare image does not.
      UV_PROJECT_ENVIRONMENT: /opt/venv
    command: bash ci-build.sh

  # Full e2e: five real coding agents making real model calls.
  e2e:
    build:
      context: .
      target: agents
    init: true
    volumes:
      - .:/workspace/agent-bus
    environment:
      # Without this every opt-in test skips itself, and the run
      # passes having tested nothing.
      AGENT_BUS_RUN_SPENDY_E2E_TESTS: "1"

      # Resolved by Compose from .env (or the shell, which wins). The keys are
      # never written into this file, and .dockerignore keeps .env out of the
      # build context entirely -- an API key baked into an image layer survives
      # in the history even if a later layer deletes it. Runtime injection only.
      #
      # The bare `ANTHROPIC_API_KEY:` form would read the shell ONLY, silently
      # passing an empty value when the keys live in .env.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}

      # Which model each harness runs is pinned in tests/support/models.py, so
      # there is nothing to declare here. Override one for a single run with
      # `docker compose run -e AGENT_BUS_PI_MODEL=<provider/id> --rm e2e`.

      # Records every verb call. The default is WARNING, which is right for an
      # agent in someone's terminal and useless for a run you are reviewing.
      AGENT_BUS_LOG_LEVEL: ${AGENT_BUS_LOG_LEVEL:-INFO}

    # Everything, in two passes, because only one of them has artefacts worth
    # keeping. `--rm` throws the container away, so this is the run you get.
    #
    # `--basetemp` is per-run, not per-test, so pointing it at the bind mount
    # put every test's tmp_path there -- hundreds of directories of empty unit
    # scratch space around the handful with anything in them. Splitting the
    # invocation is what groups them: the cheap tests keep their temp files
    # inside the container where they belong, and `.e2e/` holds one directory
    # per spendy test.
    #
    # Nothing accumulates either way: pytest empties an explicit basetemp at
    # the start of every run, so `.e2e/` always holds exactly the last one.
    # Gitignored.
    command:
      - bash
      - -c
      - |
        set -e
        uv run python -m pytest tests -q -m "not spendy"
        uv run python -m pytest tests -q -s -m spendy \
          --basetemp=/workspace/agent-bus/.e2e

  # Interactive poke-around in the full agent image.
  shell:
    build:
      context: .
      target: agents
    init: true
    volumes:
      - .:/workspace/agent-bus
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    command: bash
    stdin_open: true
    tty: true
