# Test on pull request. Publishes nothing, needs no secrets.
#
# Separate from cloudbuild.yaml because that one is a release pipeline: it
# checks out a tag, builds a wheel and uploads to PyPI. This runs on a branch,
# and the only thing the two share is the gate, which is now literally one
# file -- ci-build.sh -- rather than two copies kept alike by hand.
#
# Scope is lint + unit + tier 1. No image is built here: neither the ci nor the
# agents target is affected by a change to python, docs or terraform, and
# rebuilding one on every pull request cost 24s of a 107s build for no signal.
# Both now live in cloudbuild.image.yaml, gated on the files that shape them.
#
# Tiers 2-5 drive real coding agents making real model calls; they need
# credentials and cost money per run, so they live behind the manual trigger in
# cloudbuild.e2e.yaml rather than blocking every push.

substitutions:
  # hatch-vcs derives the version from git tags, and a trigger's checkout has
  # the commit but not the tags -- the release pipeline works only because it
  # explicitly fetches the tag it was triggered by. Nothing here publishes, so
  # rather than fetch history we tell setuptools-scm (which hatch-vcs wraps)
  # what to call it. Without this, `uv sync` fails to determine a version and
  # the whole build dies on something unrelated to the change under test.
  _PRETEND_VERSION: "0.0.0+ci"

steps:
  # The same gate cloudbuild.yaml runs before publishing.
  - id: lint-and-test
    name: ghcr.io/astral-sh/uv:python3.11-bookworm
    entrypoint: bash
    env:
      - SETUPTOOLS_SCM_PRETEND_VERSION=${_PRETEND_VERSION}
    args: ["ci-build.sh"]

options:
  logging: CLOUD_LOGGING_ONLY

# Measured across twelve builds: 79-113s, stable. Queue time before a worker is
# allocated swings between 1s and 396s and dwarfs it -- that is Cloud Build's
# default pool, not this config.
timeout: 900s
